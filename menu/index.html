<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu de la semaine</title>
<style>
  @font-face {
    font-family: Outfit;
    src: url("fonts/Outfit.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bg: #f6f6f5;
    --ink: #1a1a1a;
    --mut: #8a8a8a;
    --line: #e6e6e4;
    --soft: #f1f1ef;
  }
  * { box-sizing: border-box }
  ::selection { background: #e4e4e1 }
  body {
    margin: 0;
    min-height: 100vh;
    font: 16px/1.45 Outfit, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 56px 24px 88px }
  h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 500;
    letter-spacing: -.04em;
  }
  .range { margin: 6px 0 0; color: var(--mut); font-size: 15px; font-weight: 400 }
  .tools { display: flex; align-items: center; gap: 14px; margin-top: 22px; flex-wrap: wrap }
  .upload {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 14px;
    border: 1px solid #d5d5d2;
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    touch-action: manipulation;
  }
  .upload:hover { border-color: #1a1a1a }
  .upload.busy { opacity: .45; pointer-events: none }
  .upload input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    font-size: 16px;
    cursor: pointer;
  }
  .hint { margin: 0; color: var(--mut); font-size: 13px; font-weight: 400 }
  .hint.err { color: #8d3b3b }
  .week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0;
    margin: 32px 0 36px;
    padding: 0;
    list-style: none;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .week li {
    text-align: center;
    padding: 12px 0 11px;
    color: var(--mut);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .week b {
    display: block;
    margin-top: 4px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink);
  }
  .week .today { color: var(--ink) }
  .week .today b { box-shadow: inset 0 -1px 0 var(--ink) }
  .day { margin: 0 0 30px }
  .day h2 {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--mut);
  }
  .today-tag {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink);
  }
  .meal {
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 8px 14px;
    align-items: start;
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
  }
  .meal.fresh { background: var(--soft) }
  .when {
    margin-top: 5px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .field { position: relative; min-width: 0 }
  input[type="text"] {
    width: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: -.02em;
    outline: none;
  }
  input[type="text"]::placeholder { color: #b7b7b4; font-weight: 400 }
  .suggest {
    position: absolute;
    z-index: 5;
    left: 0;
    right: 0;
    top: calc(100% + 6px);
    margin: 0;
    padding: 4px;
    list-style: none;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .05);
  }
  .suggest[hidden] { display: none }
  .suggest.up { top: auto; bottom: calc(100% + 6px) }
  .suggest button {
    display: block;
    width: 100%;
    margin: 0;
    padding: 8px 10px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
  }
  .suggest button[aria-selected="true"],
  .suggest button:hover { background: var(--soft) }
  .suggest { max-height: 220px; overflow: auto }
  .review {
    margin-top: 18px;
    padding: 16px 16px 8px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .review[hidden] { display: none }
  .review h2 {
    margin: 0;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--mut);
  }
  .lead { margin: 6px 0 14px; color: var(--ink); font-size: 15px }
  .lead.err { color: #8d3b3b }
  .preview {
    display: block;
    max-width: 100%;
    max-height: 200px;
    width: auto;
    height: auto;
    margin: 0 auto 12px;
    border-radius: 8px;
  }
  .reads { margin: 0; padding: 0; list-style: none }
  .read {
    display: grid;
    grid-template-columns: minmax(108px, 34%) 1fr;
    gap: 8px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .read span {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--mut);
  }
  .read input {
    width: 100%;
    border: 0;
    padding: 8px 0;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 16px;
    outline: none;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }
  .charger, .relire {
    min-height: 48px;
    border-radius: 8px;
    font: inherit;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    touch-action: manipulation;
  }
  .charger {
    border: 0;
    background: #1a1a1a;
    color: #fff;
  }
  .charger:disabled { opacity: .35; cursor: default }
  .action-note { margin: -2px 0 2px; text-align: center; color: var(--mut); font-size: 13px }
  .relire {
    border: 1px solid #d5d5d2;
    background: #fff;
    color: var(--ink);
  }
  .relire:disabled { opacity: .45 }
  .transcript { margin: 8px 0 4px; }
  .transcript summary {
    cursor: pointer;
    color: var(--mut);
    font-size: 14px;
    padding: 8px 0;
  }
  .transcript pre {
    margin: 0 0 8px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: inherit;
    font-size: 15px;
    line-height: 1.45;
  }
  @media (max-width: 640px) {
    body { font-size: 16px }
    .wrap { padding: 28px 16px calc(24px + env(safe-area-inset-bottom)) }
    h1 { font-size: 28px }
    .tools { align-items: stretch }
    .upload { width: 100%; font-size: 16px }
    .hint { font-size: 14px }
    .week { margin: 22px 0 28px }
    .week li { font-size: 10px; letter-spacing: .02em; padding: 10px 0 }
    .week b { font-size: 15px }
    .day { margin-bottom: 22px }
    .meal { grid-template-columns: 48px 1fr; padding: 14px 0 }
    input[type="text"] { font-size: 16px }
    .read { grid-template-columns: 1fr; gap: 0; padding: 8px 0 4px }
    .read input { padding: 6px 0 10px; font-size: 16px }
    .actions {
      position: sticky;
      bottom: 0;
      z-index: 4;
      margin: 12px -16px 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: #fff;
      border-top: 1px solid var(--line);
    }
    .charger { min-height: 52px; font-size: 17px }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Menu de la semaine</h1>
  <p class="range" id="range"></p>
  <div class="tools">
    <label class="upload" id="upload">
      <input id="file" type="file" accept="image/*">
      Importer une image
    </label>
    <p class="hint" id="status">Photo d’un menu écrit ou d’un plat.</p>
  </div>
  <section class="review" id="review" hidden>
    <h2>Lecture</h2>
    <p class="lead" id="review-lead">Choisis une image pour la lire.</p>
    <img class="preview" id="preview" alt="Image importée" hidden>
    <ul class="reads" id="reads"></ul>
    <div class="actions">
      <button type="button" class="charger" id="charger" disabled>Charger</button>
      <p class="action-note">Valider la mise en place dans le menu</p>
      <button type="button" class="relire" id="relire" disabled>Relire</button>
    </div>
    <details class="transcript" id="transcript">
      <summary>Texte lu</summary>
      <pre id="raw"></pre>
    </details>
  </section>
  <ol class="week" id="week"></ol>
  <div id="days"></div>
</div>
<script>
const KEY = "menu-semaine-v1";
const JOURS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
const COURTS = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const CRENEAUX = ["midi", "soir"];
const DAY_INDEX = { lundi: 0, mardi: 1, mercredi: 2, jeudi: 3, vendredi: 4, samedi: 5, dimanche: 6 };
const CATALOG = [
  "Côte de porc / riz",
  "Soupe, boulettes, chou-fleur",
  "Frites nuggets",
];
const DEFAULTS = {
  "2026-11-20|soir": "Côte de porc / riz",
  "2026-11-21|midi": "Soupe, boulettes, chou-fleur",
  "2026-11-21|soir": "Frites nuggets",
};

const weekEl = document.getElementById("week");
const daysEl = document.getElementById("days");
const rangeEl = document.getElementById("range");
const fileInput = document.getElementById("file");
const upload = document.getElementById("upload");
const statusEl = document.getElementById("status");
const reviewEl = document.getElementById("review");
const reviewLead = document.getElementById("review-lead");
const previewEl = document.getElementById("preview");
const readsEl = document.getElementById("reads");
const chargerBtn = document.getElementById("charger");
const relireBtn = document.getElementById("relire");
const rawEl = document.getElementById("raw");
const transcriptEl = document.getElementById("transcript");

let state = loadState();
let openInput = null;
let activeIndex = -1;
let weekStart = null;
let scanning = false;
let currentFile = null;
let previewUrl = "";
let workerPromise = null;

const DAY_RE = /^(?:lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|lun|mar|mer|jeu|ven|sam|dim)\b\.?/i;
const SLOT_RE = /^(?:midi|soir|d[ée]jeuner|d[îi]ner|lunch|dinner)\b\.?/i;
const DAYS = {
  lundi: "lundi", lun: "lundi",
  mardi: "mardi", mar: "mardi",
  mercredi: "mercredi", mer: "mercredi",
  jeudi: "jeudi", jeu: "jeudi",
  vendredi: "vendredi", ven: "vendredi",
  samedi: "samedi", sam: "samedi",
  dimanche: "dimanche", dim: "dimanche",
};
const SLOTS = {
  midi: "midi", dejeuner: "midi", lunch: "midi",
  soir: "soir", diner: "soir", dinner: "soir",
};
const SKIP_LINES = new Set(["menu", "menu de la semaine", "a table", "repas", "semaine"]);

function norm(s) {
  return fold(s).trim();
}

function fold(s) {
  return s.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();
}

function iso(d) {
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}

function mondayOf(date) {
  const x = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const diff = x.getDay() === 0 ? -6 : 1 - x.getDay();
  x.setDate(x.getDate() + diff);
  return x;
}

function addDays(date, n) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n);
}

function rangeLabel(start, end) {
  const y = start.getFullYear();
  if (start.getMonth() === end.getMonth() && y === end.getFullYear()) {
    return `${start.getDate()} – ${end.getDate()} ${MOIS[start.getMonth()]} ${y}`;
  }
  if (y === end.getFullYear()) {
    return `${start.getDate()} ${MOIS[start.getMonth()]} – ${end.getDate()} ${MOIS[end.getMonth()]} ${y}`;
  }
  return `${start.getDate()} ${MOIS[start.getMonth()]} ${y} – ${end.getDate()} ${MOIS[end.getMonth()]} ${end.getFullYear()}`;
}

function domId(key) {
  return "plat-" + key.replace("|", "-");
}

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return { slots: { ...DEFAULTS }, extra: [] };
    const data = JSON.parse(raw);
    return {
      slots: data.slots && typeof data.slots === "object" ? data.slots : {},
      extra: Array.isArray(data.extra) ? data.extra.filter(s => typeof s === "string") : [],
    };
  } catch {
    return { slots: { ...DEFAULTS }, extra: [] };
  }
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
}

function allPlats() {
  const out = [];
  const seen = new Set();
  for (const s of [...CATALOG, ...state.extra, ...Object.values(state.slots)]) {
    const v = (s || "").trim();
    if (!v) continue;
    const k = norm(v);
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(v);
  }
  return out;
}

function remember(value) {
  const v = (value || "").trim();
  if (!v) return;
  const known = new Set(allPlats().map(norm));
  if (!known.has(norm(v))) state.extra.push(v);
}

function matches(query) {
  const q = norm(query);
  if (!q) return [];
  return allPlats()
    .filter(s => {
      const n = norm(s);
      return n.includes(q) && n !== q;
    })
    .sort((a, b) => {
      const as = norm(a).startsWith(q) ? 0 : 1;
      const bs = norm(b).startsWith(q) ? 0 : 1;
      if (as !== bs) return as - bs;
      return a.localeCompare(b, "fr");
    });
}

function closeSuggest() {
  if (!openInput) return;
  const list = openInput.parentElement.querySelector(".suggest");
  list.hidden = true;
  list.replaceChildren();
  openInput.setAttribute("aria-expanded", "false");
  openInput.removeAttribute("aria-activedescendant");
  openInput = null;
  activeIndex = -1;
}

function place(list, input) {
  list.classList.remove("up");
  const rect = input.getBoundingClientRect();
  const spaceBelow = window.innerHeight - rect.bottom;
  if (spaceBelow < list.offsetHeight + 12 && rect.top > list.offsetHeight + 12) {
    list.classList.add("up");
  }
}

function renderSuggest(input) {
  const list = input.parentElement.querySelector(".suggest");
  const items = matches(input.value);
  if (!items.length) {
    closeSuggest();
    return;
  }
  openInput = input;
  if (activeIndex >= items.length) activeIndex = items.length - 1;
  list.replaceChildren();
  items.forEach((plat, i) => {
    const li = document.createElement("li");
    li.setAttribute("role", "presentation");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.id = `${input.id}-opt-${i}`;
    btn.setAttribute("role", "option");
    btn.setAttribute("aria-selected", i === activeIndex ? "true" : "false");
    btn.textContent = plat;
    btn.addEventListener("mousedown", e => e.preventDefault());
    btn.addEventListener("mouseenter", () => {
      activeIndex = i;
      paintActive(list, input);
    });
    btn.addEventListener("click", () => choose(input, plat));
    li.append(btn);
    list.append(li);
  });
  list.hidden = false;
  input.setAttribute("aria-expanded", "true");
  place(list, input);
  paintActive(list, input);
}

function paintActive(list, input) {
  const buttons = [...list.querySelectorAll("button")];
  buttons.forEach((btn, i) => btn.setAttribute("aria-selected", i === activeIndex ? "true" : "false"));
  const current = buttons[activeIndex];
  if (current) input.setAttribute("aria-activedescendant", current.id);
  else input.removeAttribute("aria-activedescendant");
}

function choose(input, plat) {
  input.value = plat;
  state.slots[input.dataset.key] = plat;
  save();
  closeSuggest();
  input.focus();
}

function onInput(input) {
  state.slots[input.dataset.key] = input.value;
  save();
  activeIndex = -1;
  renderSuggest(input);
}

function onKey(e) {
  const input = e.currentTarget;
  const list = input.parentElement.querySelector(".suggest");
  const open = openInput === input && !list.hidden;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const items = matches(input.value);
    if (!items.length) return;
    if (!open) renderSuggest(input);
    e.preventDefault();
    const count = items.length;
    if (e.key === "ArrowDown") activeIndex = activeIndex < 0 ? 0 : (activeIndex + 1) % count;
    else activeIndex = activeIndex < 0 ? count - 1 : (activeIndex - 1 + count) % count;
    renderSuggest(input);
  } else if (e.key === "Enter" && open && activeIndex >= 0) {
    e.preventDefault();
    const plat = matches(input.value)[activeIndex];
    if (plat) choose(input, plat);
  } else if (e.key === "Escape" && open) {
    e.preventDefault();
    closeSuggest();
  }
}

function setSlot(key, dish) {
  const v = dish.trim();
  if (!v) return null;
  const prev = state.slots[key] || "";
  state.slots[key] = v;
  remember(prev);
  remember(v);
  const input = document.getElementById(domId(key));
  if (input) {
    input.value = v;
    const meal = input.closest(".meal");
    meal.classList.add("fresh");
    setTimeout(() => meal.classList.remove("fresh"), 1400);
  }
  save();
  return input;
}

function targetKey() {
  const active = document.activeElement;
  if (active && active.dataset && active.dataset.key) return active.dataset.key;
  const today = iso(new Date());
  const keys = [];
  for (let i = 0; i < 7; i++) {
    const date = iso(addDays(weekStart, i));
    for (const c of CRENEAUX) keys.push(`${date}|${c}`);
  }
  const preferred = [`${today}|midi`, `${today}|soir`, ...keys];
  for (const k of preferred) {
    if (!(state.slots[k] || "").trim()) return k;
  }
  return `${today}|soir`;
}

function slotLabel(key) {
  const [date, slot] = key.split("|");
  const d = new Date(date + "T12:00:00");
  const name = JOURS[(d.getDay() + 6) % 7].toLowerCase();
  return `${name} ${slot}`;
}

function tidy(s) {
  s = s.replace(/\s+/g, " ").replace(/^[\s:;\-–—•|,]+|[\s:;\-–—•|,]+$/g, "");
  if (!s) return "";
  if (s === s.toUpperCase() || s === s.toLowerCase()) {
    s = s.toLowerCase();
    s = s.charAt(0).toUpperCase() + s.slice(1);
  }
  return s;
}

function take(re, text) {
  const m = re.exec(text);
  if (!m) return [null, text];
  const word = fold(m[0]).replace(/[.\s]/g, "");
  const rest = text.slice(m[0].length).replace(/^[\s.:;\-–—•]+/, "");
  return [word, rest];
}

function parseMenu(text) {
  let currentDay = null;
  let currentSlot = null;
  const found = {};
  const order = [];
  const loose = [];
  function add(day, slot, dish) {
    const piece = tidy(dish);
    if (!day || !slot || piece.length < 2) return;
    const key = day + "|" + slot;
    if (found[key]) {
      if (!fold(found[key].dish).includes(fold(piece))) found[key].dish += ", " + piece;
    } else {
      found[key] = { day, slot, dish: piece };
      order.push(found[key]);
    }
  }
  for (const raw of text.split(/\n/)) {
    const line = raw.trim();
    if (!line || /^\d{1,2}$/.test(line) || SKIP_LINES.has(fold(line))) continue;
    let rest = line;
    let dayWord;
    [dayWord, rest] = take(DAY_RE, rest);
    if (dayWord) rest = rest.replace(/^\d{1,2}\b\s*/, "");
    let slotWord;
    [slotWord, rest] = take(SLOT_RE, rest);
    const day = dayWord ? DAYS[dayWord] : null;
    const slot = slotWord ? SLOTS[slotWord] : null;
    if (day) {
      currentDay = day;
      if (!slot) currentSlot = null;
    }
    if (slot) currentSlot = slot;
    if (day || slot) {
      if (rest) add(currentDay, currentSlot, rest);
      continue;
    }
    if (currentDay && currentSlot) add(currentDay, currentSlot, line);
    else loose.push(line);
  }
  return [order, loose];
}

function interpret(lines) {
  const raw = lines.join("\n").trim();
  const [meals, loose] = parseMenu(raw);
  if (meals.length) return { meals, dish: null, raw };
  const bits = loose.map(tidy).filter(b => b && (b.match(/[A-Za-zÀ-ÿ]/g) || []).length >= 3);
  if (!bits.length) return { meals: [], dish: null, raw };
  let dish = bits.length === 1 ? bits[0] : bits.join(", ");
  if (dish.length > 140) dish = dish.slice(0, 140).replace(/\s+\S*$/, "");
  return { meals: [], dish, raw };
}

function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Impossible de charger la lecture d’image."));
    document.head.append(s);
  });
}

function getWorker() {
  if (!workerPromise) {
    workerPromise = loadTesseract().then(() => Tesseract.createWorker("fra", 1, {
      logger(m) {
        if (m.status === "recognizing text" && typeof m.progress === "number") {
          reviewLead.textContent = "Lecture de l’image… " + Math.round(m.progress * 100) + " %";
        }
      },
    }));
  }
  return workerPromise;
}

function prepareImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1600;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("Impossible de lire cette image."));
    };
    img.src = url;
  });
}

async function recognize(file) {
  const local = location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if (local) {
    try {
      const r = await fetch("/api/menu-scan", {
        method: "POST",
        headers: { "Content-Type": file.type || "application/octet-stream" },
        body: await file.arrayBuffer(),
      });
      if (r.ok) return await r.json();
    } catch { /* lecture dans le navigateur */ }
  }
  reviewLead.textContent = "Préparation de la lecture…";
  const canvas = await prepareImage(file);
  const worker = await getWorker();
  const { data } = await worker.recognize(canvas);
  return interpret(String(data.text || "").split(/\n/));
}

function openReview(file) {
  reviewEl.hidden = false;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(file);
  previewEl.src = previewUrl;
  previewEl.hidden = false;
  reviewEl.scrollIntoView({ block: "start", behavior: "smooth" });
}

function fillReview(data) {
  readsEl.replaceChildren();
  const meals = Array.isArray(data.meals) ? data.meals : [];
  if (meals.length) {
    for (const m of meals) {
      if (!DAYS[m.day] && !DAY_INDEX[m.day]) continue;
      if (m.slot !== "midi" && m.slot !== "soir") continue;
      const li = document.createElement("li");
      li.className = "read";
      const span = document.createElement("span");
      span.textContent = m.day + " " + m.slot;
      const input = document.createElement("input");
      input.value = m.dish || "";
      input.dataset.day = m.day;
      input.dataset.slot = m.slot;
      input.setAttribute("aria-label", span.textContent);
      li.append(span, input);
      readsEl.append(li);
    }
  } else if (data.dish) {
    const key = targetKey();
    const li = document.createElement("li");
    li.className = "read";
    const span = document.createElement("span");
    span.textContent = slotLabel(key);
    const input = document.createElement("input");
    input.value = data.dish;
    input.dataset.key = key;
    input.setAttribute("aria-label", "Plat pour " + span.textContent);
    li.append(span, input);
    readsEl.append(li);
  }
  rawEl.textContent = data.raw || "Aucun texte détecté.";
  transcriptEl.open = true;
  const hasDish = [...readsEl.querySelectorAll("input")].some(i => i.value.trim());
  chargerBtn.disabled = !hasDish;
  reviewLead.classList.toggle("err", !hasDish);
  reviewLead.textContent = hasDish
    ? "Relis le texte, puis charge pour le placer dans le menu."
    : "Aucun plat reconnu. Relis l’image, ou réessaie avec une photo plus nette.";
  statusEl.classList.remove("err");
  statusEl.textContent = hasDish ? "Lecture prête. Appuie sur Charger." : "Aucun plat reconnu.";
}

function charger() {
  const inputs = [...readsEl.querySelectorAll("input")];
  let first = null;
  let n = 0;
  for (const input of inputs) {
    const dish = input.value.trim();
    if (!dish) continue;
    let key = input.dataset.key;
    if (!key) {
      const index = DAY_INDEX[input.dataset.day];
      if (index == null) continue;
      key = `${iso(addDays(weekStart, index))}|${input.dataset.slot}`;
    }
    const field = setSlot(key, dish);
    if (!first) first = field;
    n++;
  }
  if (!n) return;
  reviewLead.classList.remove("err");
  reviewLead.textContent = n > 1 ? `${n} repas placés dans le menu.` : "1 repas placé dans le menu.";
  statusEl.textContent = "Menu mis à jour.";
  if (first) first.scrollIntoView({ block: "center", behavior: "smooth" });
}

async function scanFile(file) {
  if (scanning || !file) return;
  currentFile = file;
  scanning = true;
  upload.classList.add("busy");
  chargerBtn.disabled = true;
  relireBtn.disabled = true;
  statusEl.classList.remove("err");
  reviewLead.classList.remove("err");
  statusEl.textContent = "Lecture de l’image…";
  openReview(file);
  reviewLead.textContent = "Lecture de l’image…";
  readsEl.replaceChildren();
  rawEl.textContent = "";
  try {
    const data = await recognize(file);
    fillReview(data);
  } catch (e) {
    reviewLead.classList.add("err");
    reviewLead.textContent = e.message || "Impossible de lire cette image.";
    statusEl.classList.add("err");
    statusEl.textContent = reviewLead.textContent;
    chargerBtn.disabled = true;
  } finally {
    scanning = false;
    upload.classList.remove("busy");
    relireBtn.disabled = !currentFile;
  }
}

function build() {
  const today = new Date();
  const todayIso = iso(today);
  weekStart = mondayOf(today);
  const end = addDays(weekStart, 6);
  rangeEl.textContent = rangeLabel(weekStart, end);

  for (let i = 0; i < 7; i++) {
    const date = addDays(weekStart, i);
    const dateIso = iso(date);
    const li = document.createElement("li");
    li.dataset.date = dateIso;
    if (dateIso === todayIso) li.classList.add("today");
    li.append(COURTS[i]);
    const b = document.createElement("b");
    b.textContent = String(date.getDate());
    li.append(b);
    weekEl.append(li);

    const section = document.createElement("section");
    section.className = "day";
    const h2 = document.createElement("h2");
    h2.textContent = `${JOURS[i]} ${date.getDate()}`;
    if (dateIso === todayIso) {
      const tag = document.createElement("span");
      tag.className = "today-tag";
      tag.textContent = "Aujourd’hui";
      h2.append(tag);
    }
    section.append(h2);

    for (const creneau of CRENEAUX) {
      const key = `${dateIso}|${creneau}`;
      const meal = document.createElement("div");
      meal.className = "meal";
      const when = document.createElement("div");
      when.className = "when";
      when.id = `when-${domId(key)}`;
      when.textContent = creneau;
      const field = document.createElement("div");
      field.className = "field";
      const input = document.createElement("input");
      input.id = domId(key);
      input.type = "text";
      input.placeholder = "Ajouter un plat";
      input.autocomplete = "off";
      input.spellcheck = false;
      input.setAttribute("role", "combobox");
      input.setAttribute("aria-autocomplete", "list");
      input.setAttribute("aria-expanded", "false");
      input.setAttribute("aria-labelledby", when.id);
      input.setAttribute("aria-controls", `list-${domId(key)}`);
      input.dataset.key = key;
      input.value = state.slots[key] || "";
      const list = document.createElement("ul");
      list.className = "suggest";
      list.id = `list-${domId(key)}`;
      list.setAttribute("role", "listbox");
      list.hidden = true;
      input.addEventListener("focus", () => {
        input.dataset.prev = state.slots[key] || "";
      });
      input.addEventListener("input", () => onInput(input));
      input.addEventListener("keydown", onKey);
      input.addEventListener("blur", () => {
        remember(input.dataset.prev || "");
        remember(input.value);
        save();
        closeSuggest();
      });
      field.append(input, list);
      meal.append(when, field);
      section.append(meal);
    }
    daysEl.append(section);
  }
}

fileInput.addEventListener("change", () => {
  const file = fileInput.files && fileInput.files[0];
  fileInput.value = "";
  scanFile(file);
});
chargerBtn.addEventListener("click", charger);
relireBtn.addEventListener("click", () => scanFile(currentFile));

document.addEventListener("dragover", e => {
  if ([...e.dataTransfer.items].some(i => i.kind === "file")) e.preventDefault();
});
document.addEventListener("drop", e => {
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!file || !file.type.startsWith("image/")) return;
  e.preventDefault();
  scanFile(file);
});
document.addEventListener("mousedown", e => {
  if (!openInput) return;
  if (e.target.closest(".field") === openInput.parentElement) return;
  closeSuggest();
});
window.addEventListener("resize", closeSuggest);

build();
</script>
